services:
  web:
    build:
      context: ${APP_BUILD_CONTEXT:?Set APP_BUILD_CONTEXT in .env}
    command: sh -c "python manage.py migrate && python manage.py runserver $${APP_BIND_HOST}:$${APP_CONTAINER_PORT} --insecure"
    volumes:
      - ${APP_SOURCE_PATH:?Set APP_SOURCE_PATH in .env}:/app
    ports:
      - "${APP_HOST_PORT:?Set APP_HOST_PORT in .env}:${APP_CONTAINER_PORT:?Set APP_CONTAINER_PORT in .env}"
    env_file: &app_env_file
      - .env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE in .env}
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: ${POSTGRES_HEALTHCHECK_INTERVAL:?Set POSTGRES_HEALTHCHECK_INTERVAL in .env}
      timeout: ${POSTGRES_HEALTHCHECK_TIMEOUT:?Set POSTGRES_HEALTHCHECK_TIMEOUT in .env}
      retries: ${POSTGRES_HEALTHCHECK_RETRIES:?Set POSTGRES_HEALTHCHECK_RETRIES in .env}

  import-worker:
    build:
      context: ${APP_BUILD_CONTEXT:?Set APP_BUILD_CONTEXT in .env}
    command: python manage.py import_worker
    restart: ${WORKER_RESTART_POLICY:?Set WORKER_RESTART_POLICY in .env}
    volumes:
      - ${APP_SOURCE_PATH:?Set APP_SOURCE_PATH in .env}:/app
    env_file: *app_env_file
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started

  export-worker:
    build:
      context: ${APP_BUILD_CONTEXT:?Set APP_BUILD_CONTEXT in .env}
    command: python manage.py export_worker
    restart: ${WORKER_RESTART_POLICY:?Set WORKER_RESTART_POLICY in .env}
    volumes:
      - ${APP_SOURCE_PATH:?Set APP_SOURCE_PATH in .env}:/app
    env_file: *app_env_file
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:?Set POSTGRES_VOLUME_NAME in .env}
