<form method="get" class="rows-control">
    <input type="hidden" name="tab" value="{{ active_tab }}">
    <label class="sr-only" for="contract-page-size">Количество строк</label>
    <select id="contract-page-size" class="form-control" name="per_page" data-contract-page-size>{% for size in page_sizes %}<option value="{{ size }}"{% if size == page_size %} selected{% endif %}>{{ size }} строк</option>{% endfor %}</select>
    <noscript><button class="btn btn-sm" type="submit">Показать</button></noscript>
</form>
